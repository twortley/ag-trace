[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-trace"
dynamic = ["version"]
description = "Capture Antigravity conversation traces as hashed, lossless test evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{name = "Tim Wortley"}]
dependencies = []  # standard library only, deliberately

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ag-trace = "ag_trace.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ag_trace.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510"]
